<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 1008" width="576" height="1008">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a120a"/>
      <stop offset="100%" stop-color="#2d1f0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#c8873a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c8873a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1a0a"/>
      <stop offset="100%" stop-color="#100a04"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8873a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c8873a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="576" height="1008" fill="url(#bg)"/>
  <!-- Atmospheric glow -->
  <ellipse cx="288" cy="680" rx="260" ry="200" fill="url(#glow)"/>
  <!-- Floor -->
  <rect x="0" y="680" width="576" height="328" fill="url(#floor)"/>
  <!-- Floor spotlight -->
  <ellipse cx="288" cy="720" rx="200" ry="60" fill="url(#spot)"/>
  <!-- Floor reflection line -->
  <line x1="0" y1="680" x2="576" y2="680" stroke="#c8873a" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Boot silhouette (stylised) -->
  <!-- Sole -->
  <rect x="148" y="590" width="280" height="38" rx="8" fill="#2a1a0a"/>
  <rect x="148" y="590" width="280" height="38" rx="8" fill="none" stroke="#c8873a" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Boot body -->
  <path d="M165 590 L165 430 Q168 390 200 380 L290 374 Q330 372 345 395 L428 530 L428 590 Z" fill="#b8762a"/>
  <!-- Boot toe -->
  <path d="M165 560 Q155 580 148 592 L428 592 L428 555 Q380 548 165 560Z" fill="#8b5620"/>
  <!-- Laces area -->
  <rect x="195" y="400" width="130" height="155" rx="4" fill="#6b4015" opacity="0.5"/>
  <!-- Laces -->
  <line x1="210" y1="420" x2="310" y2="420" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="208" y1="440" x2="308" y2="440" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="206" y1="460" x2="306" y2="460" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="204" y1="480" x2="304" y2="480" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="202" y1="500" x2="302" y2="500" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="200" y1="520" x2="300" y2="520" stroke="#e8c880" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Boot highlight -->
  <path d="M200 390 Q220 384 260 382 Q290 380 310 388" stroke="#e8c060" stroke-width="2" fill="none" stroke-opacity="0.5"/>
  <!-- Floor reflection (boot) -->
  <path d="M165 682 L165 760 Q168 780 200 784 L290 788 Q330 790 345 775 L428 720 L428 682 Z" fill="#c8873a" opacity="0.08"/>
  <!-- Brand name -->
  <text x="288" y="830" font-family="Georgia, serif" font-size="42" font-weight="700" letter-spacing="6" fill="#c8873a" text-anchor="middle" opacity="0.9">TIMBERLAND</text>
  <!-- Tag line -->
  <text x="288" y="872" font-family="Arial, sans-serif" font-size="16" letter-spacing="4" fill="#e8d0a0" text-anchor="middle" opacity="0.7">BUILT FOR THE BOLD</text>
  <!-- Top hook copy -->
  <text x="288" y="120" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.95">Step into</text>
  <text x="288" y="182" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#c8873a" text-anchor="middle" opacity="0.95">the wild.</text>
  <!-- Particle dots -->
  <circle cx="120" cy="300" r="2" fill="#c8873a" opacity="0.4"/>
  <circle cx="460" cy="260" r="1.5" fill="#c8873a" opacity="0.3"/>
  <circle cx="80" cy="450" r="1" fill="#c8873a" opacity="0.2"/>
  <circle cx="490" cy="410" r="2" fill="#c8873a" opacity="0.3"/>
  <circle cx="140" cy="560" r="1.5" fill="#c8873a" opacity="0.25"/>
</svg>
