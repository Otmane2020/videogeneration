<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Footage library | ClipMotion</title><link rel="stylesheet" href="/style.css">
<style>
#app{max-width:1280px}
.stats{color:var(--mute);font-size:14px;margin:6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chips button{font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--grad);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.clip{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.clip .vid{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.clip img,.clip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.clip .vid b{position:absolute;left:8px;bottom:8px;font-size:11px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:2px 6px}
.clip .meta{padding:9px 10px;font-size:12px;color:var(--mute);display:grid;gap:5px}
.clip .meta strong{color:var(--text);font-weight:600}
.clip .links{display:flex;gap:10px;flex-wrap:wrap}
.clip a{color:#c9a5ff;text-decoration:none}
dialog{border:0;border-radius:16px;padding:0;background:#000;max-width:min(94vw,1100px)}
dialog video{display:block;max-width:94vw;max-height:84vh}
dialog::backdrop{background:rgba(0,0,0,.8)}
</style></head>
<body><main id="app">
<header><a class="logo" href="/"><span class="mark"></span><span class="wm">Clip<b>Motion</b></span></a></header>
<h1 style="font-size:30px">Footage library</h1>
<p class="stats" id="stats">Loading…</p>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<dialog id="dlg"><video id="dv" controls autoplay playsinline></video></dialog>
<script>
const $ = (s) => document.querySelector(s), el = (t, p = {}) => Object.assign(document.createElement(t), p);
let data, sector = '';
function render() {
  const list = data.clips.filter((c) => !sector || (c.s || []).includes(sector));
  $('#grid').replaceChildren(...list.map((c) => {
    const card = el('div', { className: 'clip' }), box = el('div', { className: 'vid' });
    box.append(el('img', { src: c.thumb, loading: 'lazy', alt: '' }), el('b', { textContent: `${c.w}×${c.h} · ${Math.round(c.d)}s${c.hd ? ' · HD' : ''}` }));
    // survol : lecture de la version légère ; clic : version HD en grand
    box.onmouseenter = () => { const v = el('video', { src: c.lite, muted: true, loop: true, autoplay: true, playsInline: true }); box.prepend(v); };
    box.onmouseleave = () => box.querySelector('video')?.remove();
    box.onclick = () => { $('#dv').src = c.hd || c.sd; $('#dlg').showModal(); };
    const meta = el('div', { className: 'meta' });
    meta.append(el('strong', { textContent: (c.s || []).join(', ') }), el('span', { textContent: (c.k || []).slice(0, 3).join(' · ') }), el('span', { textContent: c.tags.slice(0, 90) }));
    const links = el('div', { className: 'links' });
    links.append(el('a', { href: c.hd || c.sd, target: '_blank', rel: 'noopener', textContent: 'MP4 ' + (c.hd ? 'HD' : '') }), el('a', { href: `https://pixabay.com/videos/id-${c.id}/`, target: '_blank', rel: 'noopener', textContent: 'Pixabay #' + c.id }));
    meta.append(links); card.append(box, meta); return card;
  }));
  $('#chips').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.s === sector)));
}
$('#dlg').addEventListener('close', () => { $('#dv').pause(); $('#dv').removeAttribute('src'); });
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close(); });
fetch('/api/footage').then((r) => r.json()).then((j) => {
  data = j;
  $('#stats').textContent = `${j.total} clips · ${j.hd} in HD · loaded from ${j.source === 'file' ? 'the code file (database not reached)' : 'the database'}`;
  const mk = (label, s, n) => el('button', { type: 'button', dataset: { s }, textContent: n ? `${label} (${n})` : label, onclick: () => { sector = s; render(); } });
  $('#chips').replaceChildren(mk('All', '', j.total), ...Object.entries(j.sectors).sort((a, b) => b[1] - a[1]).map(([s, n]) => mk(s, s, n)));
  render();
}).catch(() => { $('#stats').textContent = 'Could not load the library.'; });
</script>
</main></body></html>
