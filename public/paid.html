<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Payment | ClipMotion</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app" style="max-width:520px;text-align:center;padding-top:18vh">
<span class="logo" style="justify-content:center;font-size:22px"><span class="mark"></span><span class="wm">Clip<b>Motion</b></span></span>
<h1 style="font-size:32px;margin:26px 0 10px" id="t">Confirming your purchase…</h1>
<p class="lead" id="m"></p>
<script>
const q = new URLSearchParams(location.search), t = document.getElementById('t'), m = document.getElementById('m');
if (q.get('cancelled')) { t.textContent = 'Payment cancelled'; m.textContent = 'Nothing was charged. You can close this tab and go back to your video.'; }
else fetch('/api/checkout', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ confirm: q.get('session_id') }) }).then((r) => r.json()).then((j) => {
  t.textContent = j.granted ? 'All set' : 'Purchase not confirmed';
  m.textContent = j.granted ? 'Go back to your ClipMotion tab: your video is being exported without the watermark.' : (j.error || 'We could not confirm this purchase. If you were charged, contact us.');
}).catch(() => { t.textContent = 'Purchase not confirmed'; });
</script>
</main></body></html>
